name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev libudev-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Interface tests
        run: npm test
      - name: Typecheck and bundle
        run: npm run build
      - name: Device layer tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    name: Package
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    # Deliberately not ubuntu-latest: the binary is linked against the glibc of
    # whatever built it, and a package built on a newer release simply refuses
    # to start on an older one.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev libudev-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy ships a strip that cannot read .relr.dyn sections.
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          # Pinned rather than inherited from tauri.conf.json, which also lists
          # rpm: an RPM built on Ubuntu carries Debian assumptions about
          # package names. That one is built on Fedora, by
          # packaging/linux/build.sh, and uploaded to the same release.
          args: --bundles deb,appimage
          tagName: ${{ github.ref_name }}
          releaseName: "Gear Control Center ${{ github.ref_name }}"
          releaseBody: |
            Built on Ubuntu 22.04, so the packages run on glibc 2.35 and newer.

            **AppImage** — `chmod +x` and run it. Nothing to install.
            **deb** — `sudo apt install ./gear-control-center_*.deb`

            No udev rule is needed on a current distribution. If the headset is
            found but cannot be opened, something else is holding it — see
            [troubleshooting](docs/troubleshooting.md).
          releaseDraft: false
          prerelease: false
