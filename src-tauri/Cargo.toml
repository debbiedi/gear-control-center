[package]
name = "headset-control-center"
version = "0.4.1"
description = "Control and configure supported USB gaming headsets"
authors = ["Kadir Nergiz"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "headset_cc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Declared explicitly, and in this order, because the Tauri bundler picks the
# package's first binary target as the application. Left to auto-discovery it
# picked headsetctl, and shipped a .deb whose desktop entry launched the
# command-line tool. Order here is not cosmetic.
[[bin]]
name = "headset-control-center"
path = "src/main.rs"

[[bin]]
name = "headsetctl"
path = "src/bin/headsetctl.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
parking_lot = "0.12"
hidapi = "2.6"
alsa = "0.12"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-notification = "2.3.3"

[target.'cfg(target_os = "linux")'.dependencies]
udev = "0.9"

[profile.release]
codegen-units = 1
lto = true
strip = true
